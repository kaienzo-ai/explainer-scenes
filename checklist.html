<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>checklist — explainer-scenes</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #f4efe1;
    --ink: #1a1a1a;
    --red: #7d1414;
    --rule: #d6cfb8;
    --muted: #6b6b6b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    background: #2a1010;
    display: flex; align-items: center; justify-content: center;
    font-family: "Inter", -apple-system, sans-serif;
  }
  .scene {
    aspect-ratio: 9 / 16;
    height: min(96vh, 1280px);
    background: var(--cream);
    color: var(--ink);
    position: relative;
    overflow: hidden;
    padding: 9% 8%;
    display: flex;
    flex-direction: column;
  }
  .kicker {
    font-size: 0.95rem;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: var(--red);
    font-weight: 800;
  }
  .title {
    font-family: "Anton", Impact, sans-serif;
    font-size: clamp(2.6rem, 6vh, 4rem);
    line-height: 0.95;
    letter-spacing: 0.005em;
    text-transform: uppercase;
    margin: 1rem 0 2rem;
  }
  .items {
    display: flex;
    flex-direction: column;
    flex: 1;
  }
  .item {
    display: grid;
    grid-template-columns: auto 1fr;
    align-items: center;
    gap: 1.2rem;
    padding: 1.1rem 0;
    border-top: 1px solid var(--rule);
  }
  .item:last-child { border-bottom: 1px solid var(--rule); }
  .check {
    width: 1.8rem;
    height: 1.8rem;
    background: var(--red);
    color: var(--cream);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .text {
    font-family: "Anton", Impact, sans-serif;
    font-size: clamp(1.4rem, 3.5vh, 2.2rem);
    line-height: 1;
    text-transform: uppercase;
    letter-spacing: 0.01em;
  }
  .count {
    margin-top: 1.5rem;
    font-family: "Anton", Impact, sans-serif;
    font-size: 1.4rem;
    color: var(--red);
    letter-spacing: 0.05em;
  }
  .footer {
    margin-top: auto;
    font-size: 0.8rem;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--muted);
    display: flex;
    justify-content: space-between;
  }
</style>
</head>
<body>
  <div class="scene">
    <div class="kicker">Checklist</div>
    <h1 class="title">Pre-<br>migration</h1>
    <div class="items">
      <div class="item">
        <span class="check"><svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M5 13l4 4L19 7" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
        <div class="text">Backup verified</div>
      </div>
      <div class="item">
        <span class="check"><svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M5 13l4 4L19 7" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
        <div class="text">Dry-run on staging</div>
      </div>
      <div class="item">
        <span class="check"><svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M5 13l4 4L19 7" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
        <div class="text">Rollback plan</div>
      </div>
      <div class="item">
        <span class="check"><svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M5 13l4 4L19 7" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
        <div class="text">On-call paged</div>
      </div>
      <div class="item">
        <span class="check"><svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M5 13l4 4L19 7" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
        <div class="text">Monitoring open</div>
      </div>
    </div>
    <div class="count">5 / 5 complete</div>
    <div class="footer" style="margin-top:1.5rem;"><span>Scene · Checklist</span><span>06 / 08</span></div>
  </div>
</body>
</html>
