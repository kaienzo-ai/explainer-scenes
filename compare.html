<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>compare — explainer-scenes</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #f4efe1;
    --ink: #1a1a1a;
    --red: #7d1414;
    --rule: #d6cfb8;
    --faded: #9a9385;
    --muted: #6b6b6b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    background: #2a1010;
    display: flex; align-items: center; justify-content: center;
    font-family: "Inter", -apple-system, sans-serif;
  }
  .scene {
    aspect-ratio: 9 / 16;
    height: min(96vh, 1280px);
    background: var(--cream);
    color: var(--ink);
    position: relative;
    overflow: hidden;
    padding: 9% 8%;
    display: flex;
    flex-direction: column;
  }
  .kicker {
    font-size: 0.95rem;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: var(--red);
    font-weight: 800;
  }
  .title {
    font-family: "Anton", Impact, sans-serif;
    font-size: clamp(2.6rem, 6vh, 4rem);
    line-height: 0.95;
    letter-spacing: 0.005em;
    text-transform: uppercase;
    margin: 1rem 0 1.5rem;
  }
  .columns {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0;
    flex: 1;
    border-top: 1px solid var(--rule);
  }
  .col {
    padding: 1.6rem 0 0;
  }
  .col.bad { padding-right: 1.4rem; border-right: 1px solid var(--rule); }
  .col.good { padding-left: 1.4rem; }
  .col-tag {
    font-family: "Anton", Impact, sans-serif;
    font-size: 1.6rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-bottom: 1rem;
  }
  .col.bad .col-tag { color: var(--faded); text-decoration: line-through; text-decoration-thickness: 2px; }
  .col.good .col-tag { color: var(--red); }
  .col-head {
    font-family: "Anton", Impact, sans-serif;
    font-size: clamp(1.5rem, 3.5vh, 2.1rem);
    line-height: 1;
    text-transform: uppercase;
    margin-bottom: 1.2rem;
  }
  .col.bad .col-head { color: var(--faded); }
  .col ul {
    list-style: none;
    padding: 0;
    margin: 0;
    display: flex;
    flex-direction: column;
    gap: 0.8rem;
    font-size: 1rem;
    line-height: 1.35;
    font-weight: 500;
  }
  .col.bad ul { color: var(--faded); }
  .col li::before {
    content: "—";
    margin-right: 0.5rem;
    color: inherit;
    opacity: 0.7;
  }
  .footer {
    margin-top: 1.5rem;
    font-size: 0.8rem;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--muted);
    display: flex;
    justify-content: space-between;
    padding-top: 1.2rem;
    border-top: 1px solid var(--rule);
  }
</style>
</head>
<body>
  <div class="scene">
    <div class="kicker">Compare</div>
    <h1 class="title">Deployment<br>models</h1>
    <div class="columns">
      <div class="col bad">
        <div class="col-tag">Before</div>
        <div class="col-head">Manual<br>deploys</div>
        <ul>
          <li>Weekly cadence</li>
          <li>One-person bottleneck</li>
          <li>Rollback is a panic</li>
          <li>Environment drift</li>
        </ul>
      </div>
      <div class="col good">
        <div class="col-tag">After</div>
        <div class="col-head">Automated<br>rollouts</div>
        <ul>
          <li>Multiple times daily</li>
          <li>Any engineer ships</li>
          <li>Rollback is a button</li>
          <li>Environments in sync</li>
        </ul>
      </div>
    </div>
    <div class="footer"><span>Scene · Compare</span><span>04 / 08</span></div>
  </div>
</body>
</html>
