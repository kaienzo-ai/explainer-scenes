<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>decision — explainer-scenes</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #f4efe1;
    --red: #7d1414;
    --red-deep: #5a0f0f;
    --muted: rgba(244,239,225,0.55);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    background: #2a1010;
    display: flex; align-items: center; justify-content: center;
    font-family: "Inter", -apple-system, sans-serif;
  }
  .scene {
    aspect-ratio: 9 / 16;
    height: min(96vh, 1280px);
    background: var(--red);
    color: var(--cream);
    position: relative;
    overflow: hidden;
    padding: 9% 8%;
    display: flex;
    flex-direction: column;
  }
  .kicker {
    font-size: 0.95rem;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    font-weight: 800;
    opacity: 0.75;
  }
  .question {
    font-family: "Anton", Impact, sans-serif;
    font-size: clamp(4rem, 12vh, 7rem);
    line-height: 0.9;
    letter-spacing: 0.005em;
    text-transform: uppercase;
    margin: 1rem 0 auto;
  }
  .mark {
    font-family: "Anton", Impact, sans-serif;
    font-size: clamp(8rem, 22vh, 14rem);
    line-height: 1;
    margin: -1rem 0 -2rem;
    opacity: 0.9;
  }
  .branches {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0;
    border-top: 1px solid var(--muted);
    margin-top: 2rem;
  }
  .branch {
    padding: 1.6rem 0.8rem 0;
    position: relative;
  }
  .branch:first-child { border-right: 1px solid var(--muted); padding-right: 1.4rem; }
  .branch:last-child  { padding-left: 1.4rem; }
  .tag {
    font-family: "Anton", Impact, sans-serif;
    font-size: 1.4rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    opacity: 0.6;
    margin-bottom: 0.6rem;
  }
  .outcome {
    font-family: "Anton", Impact, sans-serif;
    font-size: clamp(1.8rem, 4.5vh, 2.8rem);
    line-height: 1;
    text-transform: uppercase;
  }
  .footer {
    margin-top: auto;
    font-size: 0.8rem;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    opacity: 0.55;
    display: flex;
    justify-content: space-between;
    padding-top: 1.6rem;
  }
</style>
</head>
<body>
  <div class="scene">
    <div class="kicker">Decision</div>
    <div class="mark">?</div>
    <h1 class="question">Tests<br>passed?</h1>
    <div class="branches">
      <div class="branch">
        <div class="tag">If no</div>
        <div class="outcome">Block<br>merge</div>
      </div>
      <div class="branch">
        <div class="tag">If yes</div>
        <div class="outcome">Deploy</div>
      </div>
    </div>
    <div class="footer"><span>Scene · Decision</span><span>02 / 08</span></div>
  </div>
</body>
</html>
